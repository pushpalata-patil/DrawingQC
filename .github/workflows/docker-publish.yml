name: Build and push Docker image

# Builds the web app image and pushes it to GitHub Container Registry (GHCR) so a Docker Swarm
# (Portainer) can pull and run it — Swarm can't build from a Dockerfile itself.

on:
  push:
    branches: [ master ]
    paths:
      - "DrawingQC.Web/**"
      - "DrawingQC.UI/**"
      - "DrawingQC.Agent/**"
      - "DrawingQC.Web/Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase the image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drawingqc" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch — runs natively on Intel/AMD and ARM nodes)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DrawingQC.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
