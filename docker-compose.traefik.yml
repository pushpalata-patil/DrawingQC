# Portainer **Swarm** stack routed through your existing **Traefik** (HTTPS), DB on Supabase,
# files on the VM disk. Traefik settings are taken from your Traefik service:
#   network = traefik-public, https entrypoint = websecure, cert resolver = le,
#   and the required constraint label traefik.constraint-label=traefik-public.
#
# Deploy in Portainer:  Stacks → Add stack → Git repository
#   Repository URL:  https://github.com/pushpalata-patil/DrawingQC
#   Repository reference:  refs/heads/master
#   Compose path:    docker-compose.traefik.yml
#   Environment variables (only two):
#     SUPPORTAUTOMATION_DB = postgresql://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
#     APP_DOMAIN           = drawingqc.inventivebizsol.co.in
#   Deploy → open https://<APP_DOMAIN>
#
# Prereq: APP_DOMAIN must resolve to this server (a DNS A/CNAME record, like your other apps),
# because Traefik's `le` resolver validates the cert over HTTP (the `web` entrypoint, port 80).

version: "3.8"

services:
  web:
    image: ghcr.io/pushpalata-patil/drawingqc:latest
    environment:
      PORT: "8080"
      SUPPORTAUTOMATION_DB: "${SUPPORTAUTOMATION_DB}"
      SUPPORTAUTOMATION_FILE_STORE: "disk"
      SUPPORTAUTOMATION_DATA_DIR: "/data"
    volumes:
      - dqc_files:/data
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.drawingqc.rule=Host(`${APP_DOMAIN}`)"
        - "traefik.http.routers.drawingqc.entrypoints=websecure"
        - "traefik.http.routers.drawingqc.tls=true"
        - "traefik.http.routers.drawingqc.tls.certresolver=le"
        - "traefik.http.services.drawingqc.loadbalancer.server.port=8080"

networks:
  traefik-public:
    external: true

volumes:
  dqc_files:
