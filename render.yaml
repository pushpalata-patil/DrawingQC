databases:
  # Managed PostgreSQL so team data (accounts, ConsList, run history) survives redeploys.
  # Free plan is fine to start; note Render free databases expire 30 days after creation
  # (14-day grace period, then deleted). Upgrade the plan if the team data matters.
  - name: drawingqc-db
    plan: free

services:
  - type: web
    name: drawingqc-web
    runtime: docker
    plan: free
    dockerfilePath: ./DrawingQC.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Switches the app into PostgreSQL mode; Db.cs parses this postgres:// URL form.
      - key: SUPPORTAUTOMATION_DB
        fromDatabase:
          name: drawingqc-db
          property: connectionString
