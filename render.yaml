# Render blueprint for the web service. The database is now external (Supabase) — set
# SUPPORTAUTOMATION_DB in the Render dashboard (Environment) to your Supabase session-pooler
# connection string. See SUPABASE.md.

services:
  - type: web
    name: drawingqc-web
    runtime: docker
    plan: free
    dockerfilePath: ./DrawingQC.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # The app's database. Set this in the Render dashboard to the Supabase connection string
      # (kept out of the repo because it's a secret). Db.cs accepts the postgres:// URL form.
      - key: SUPPORTAUTOMATION_DB
        sync: false
